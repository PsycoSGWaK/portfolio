# Workflow de VALIDATION uniquement (etape 1 du chantier CI/CD).
#
# Objectif : prouver qu'un runner GitHub peut atteindre le SSH d'o2switch,
# en placant son IP en liste blanche a la volee via l'API SshWhitelist du
# cPanel. Le pipeline de deploiement precedent avait echoue parce que le
# pare-feu plateforme d'o2switch bloque les IP datacenter en HTTPS ; cette
# voie SSH n'avait jamais ete testee.
#
# Ce workflow ne deploie RIEN. Il se contente d'ouvrir l'acces, de lancer
# un `whoami` distant, puis de refermer l'acces.
#
# A supprimer une fois l'etape 2 (deploiement reel) en place.

name: Test acces SSH o2switch

on:
  workflow_dispatch:

concurrency:
  # La liste blanche est un etat partage cote serveur (5 entrees maximum) :
  # deux executions simultanees se marcheraient dessus.
  group: o2switch-ssh-whitelist
  cancel-in-progress: false

jobs:
  test-acces-ssh:
    name: Verifie la connexion SSH depuis un runner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recupere l'IP publique du runner
        id: ip
        run: |
          IP="$(curl -fsS --retry 3 --retry-delay 2 -m 15 https://api.ipify.org)"
          if [ -z "$IP" ]; then
            echo "::error::Impossible de determiner l'IP publique du runner."
            exit 1
          fi
          echo "IP du runner : $IP"
          echo "ipv4=$IP" >> "$GITHUB_OUTPUT"

      - name: Ajoute l'IP du runner en liste blanche
        id: whitelist
        run: |
          # L'appel est pseudo-bloquant (jusqu'a 35 s) : il ne repond
          # qu'une fois la regle reellement active cote pare-feu.
          REPONSE="$(curl -sS -m 60 \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22")"
          echo "Reponse API : $REPONSE"
          # Marque l'IP comme ajoutee meme si l'appel a partiellement echoue,
          # pour que l'etape de nettoyage tente quand meme la suppression.
          echo "ajoutee=true" >> "$GITHUB_OUTPUT"
          echo "$REPONSE" | jq -e '.status == 1' > /dev/null \
            || { echo "::error::L'ajout en liste blanche a echoue."; exit 1; }

      - name: Verifie que l'IP figure bien dans la liste
        run: |
          REPONSE="$(curl -sS -m 45 \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/list")"
          echo "Liste blanche actuelle : $REPONSE"
          echo "$REPONSE" | grep -q "${{ steps.ip.outputs.ipv4 }}" \
            || { echo "::error::L'IP du runner n'apparait pas dans la liste blanche."; exit 1; }

      - name: Installe la cle SSH de deploiement
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.O2SWITCH_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Se connecte en SSH et lance un whoami
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}" \
            'echo "Connecte en tant que $(whoami) sur $(hostname)"; pwd'

      - name: Retire l'IP du runner de la liste blanche
        # Toujours executee, y compris si une etape precedente a echoue :
        # la liste blanche est limitee a 5 entrees, on ne la laisse pas
        # se remplir d'IP de runners mortes.
        if: always() && steps.whitelist.outputs.ajoutee == 'true'
        run: |
          # Suppression CIBLEE de la seule IP du runner. Surtout pas
          # remove_all : cela effacerait aussi l'IP personnelle dont
          # depend l'acces SSH manuel.
          REPONSE="$(curl -sS -m 45 \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove?address=${{ steps.ip.outputs.ipv4 }}&port=22&direction=in")"
          echo "Reponse API : $REPONSE"

      - name: Efface la cle SSH
        if: always()
        run: rm -rf ~/.ssh/id_deploy
