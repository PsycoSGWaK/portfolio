name: Deploy to o2switch

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Env de BUILD uniquement (jamais utilisé en prod). Le vrai APP_SECRET /
    # DATABASE_URL vivent dans shared/.env.local sur le serveur. Ces valeurs
    # servent juste à faire booter le kernel Symfony en mode prod pendant le
    # build (composer auto-scripts, compilation de l'asset-map).
    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: build-only-not-a-real-secret
      DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci?serverVersion=8.4.7&charset=utf8mb4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PHP identique à la prod o2switch (8.4 + extensions requises par Symfony).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo, pdo_mysql, mysqli, mbstring, intl, zip, opcache, phar, curl, iconv
          tools: composer
          coverage: none

      # Composer tourne ICI, sur le runner — plus jamais sur o2switch.
      - name: Install PHP dependencies (prod)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # Compilation de l'asset-map (importmap + hashing) sur le runner.
      - name: Compile assets
        run: php bin/console asset-map:compile

      # Paquet déployable : code + vendor + public/assets compilés.
      # On exclut .git, var/ et .env.local (fournis par shared/ côté serveur),
      # plus les dossiers inutiles en prod.
      - name: Package artifact
        run: |
          tar -czf /tmp/build.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./var' \
            --exclude='./.env.local' \
            --exclude='./tests' \
            --exclude='./node_modules' \
            .
          ls -lh /tmp/build.tar.gz

      # Envoi + déclenchement via HTTPS (443, ouvert). Aucun SSH entrant requis.
      - name: Deploy via HTTPS webhook
        run: |
          # --http1.1 : évite une erreur de protocole HTTP/2 constatée sur cet hébergement
          # mutualisé lors de l'upload multipart d'un gros fichier (curl error 92,
          # "stream was not closed cleanly"). --max-time large car composer/migrations
          # tournent côté serveur pendant que la connexion HTTP reste ouverte.
          # User-Agent/Referer de navigateur : le WAF plateforme d'o2switch semble
          # bloquer spécifiquement le trafic à signature "outil automatisé" (curl brut
          # depuis une IP datacenter), constaté par une coupure de connexion sans
          # trace dans le domlog Apache.
          HTTP=$(curl -sS --http1.1 --max-time 300 --fail-with-body -o /tmp/deploy.log -w '%{http_code}' \
            -X POST \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Referer: https://guillaumehurard.fr/" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_HOOK_TOKEN }}" \
            -F "artifact=@/tmp/build.tar.gz" \
            "${{ secrets.DEPLOY_HOOK_URL }}") || true
          echo "----- réponse serveur -----"
          cat /tmp/deploy.log || true
          echo ""
          echo "----- HTTP $HTTP -----"
          test "$HTTP" = "200"

      # Fait depuis le runner (pas depuis le serveur o2switch lui-même) pour
      # éviter l'auto-deadlock du pool PHP-FPM constaté quand finalize.sh
      # s'auto-interrogeait en HTTP. Ici, échec = run rouge visible, mais PAS
      # de rollback automatique : la release est déjà "current" à ce stade
      # (finalize.sh a déjà vérifié que le kernel boote avant de basculer).
      - name: Health check
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://guillaumehurard.fr/)
          echo "HTTP $CODE"
          test "$CODE" = "200"
